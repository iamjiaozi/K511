<div class="header" id="header">
  <div class="pc_banner mtbanner">
    <div class="pcbanner">
      <div class="swiper-wrapper">
        {pboot:sort scode={sort:tcode}}<div class="swiper-slide"><img src="[sort:pic]"></div>{/pboot:sort}
      </div>
    </div>
  </div>
  <div class="head_top clearfix" id="headtop">
    <div class="center">
      <div class="text clearfix">
        <div class="logo"> <a href="{pboot:sitedomain}/"><img src="{pboot:sitelogo}"></a> </div>
        <div class="nav">
          <ul>
            <li {pboot:if(0=='{sort:scode}')}class="active"{/pboot:if}><a href="{pboot:sitedomain}/">首页</a></li>
            {pboot:nav}
            <li {pboot:if('[nav:scode]'=='{sort:tcode}')}class="active"{/pboot:if}> <a href="[nav:link]">[nav:name]</a></li>
            {/pboot:nav}
          </ul>
        </div>
        <script type="text/javascript">
			$(".nav li").hover(function(){
				//$(this).toggleClass("active").siblings('.nav li').removeClass("active");//切换图标
				$(this).children(".nav .v_list").slideToggle(150).siblings("#app_menu .v_list").slideUp(150);
			});
		</script>
        <div class="tel">
          <p> <span>{pboot:companyphone}</span> </p>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="m_header">
  <div class="m_head_content">
    <div class="m_head_logo"> <a href="{pboot:sitedomain}/"><img src="{pboot:sitelogo}"></a> </div>
    <div class="menu" id="menu"><i class="fa fa-list-ul"></i></div>
  </div>
  <div class="app_menu" id="app_menu">
    <ul>
      <li {pboot:if(0=='{sort:scode}')}class="active"{/pboot:if}><a href="{pboot:sitedomain}/"><span>首页</span></a></li>
      {pboot:nav}
      <li {pboot:if('[nav:scode]'=='{sort:tcode}')}class="active"{/pboot:if}> <a href="[nav:link]"><span>[nav:name]</span></a></li>
      {/pboot:nav}
    </ul>
  </div>
  <script type="text/javascript">
            $("#menu").on('click', function (event) {
                if($("#app_menu").css("display")=="none"){
                    $("#app_menu").slideDown(600);
                }else{
                    $("#app_menu").slideUp(600);
                }
            }); 
            // $("#app_menu li").eq(2).addClass('on');
            // $("#app_menu li").eq(3).addClass('on');

            $("#app_menu li").click(function(){
                $(this).toggleClass("active").siblings('#app_menu li').removeClass("active");//切换图标
                $(this).next("#app_menu .v_list").slideToggle(500).siblings("#app_menu .v_list").slideUp(500);
            });
        </script> 
</div>
